---
# ==========================================================
# group_vars/app.yml — pool Tomcat (groupe [app])
# ==========================================================

# --- Java ---
java_package: java-17-openjdk-headless     # Debian : openjdk-17-jre-headless

# --- Tomcat (installation depuis l'archive officielle) ---
tomcat_version: "9.0.89"
tomcat_download_base: "https://archive.apache.org/dist/tomcat"
tomcat_user: tomcat
tomcat_group: tomcat
tomcat_base_dir: /opt
tomcat_home: /opt/tomcat                   # lien symbolique vers la version
tomcat_shutdown_port: 8005

# --- Application déployée ---
tomcat_app_name: "app"                     # => contexte /app
tomcat_app_title: "Lab Ansible — Application Java"

# false : on déploie un dossier webapps/app (déploiement « exploded »)
# true  : Ansible package l'application en app.war avec la commande jar
tomcat_package_as_war: false

# Options JVM du service systemd
tomcat_java_opts: "-Xms256m -Xmx512m -Djava.security.egd=file:/dev/./urandom"
