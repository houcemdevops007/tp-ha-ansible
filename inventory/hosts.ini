# ==========================================================
# inventory/hosts.ini — inventaire du lab
# Adaptez UNIQUEMENT les adresses IP à votre réseau Proxmox
# ==========================================================

# --- Le load balancer (point d'entrée unique) ---
[lb]
lb1   ansible_host=192.168.56.11

# --- Pool 1 : serveurs Apache (site statique) ---
# server_badge_* : couleur et libellé propres à chaque serveur,
# pour voir visuellement la répartition de charge dans le navigateur
[web]
web1  ansible_host=192.168.56.21  server_badge_color="#1d7a46"  server_badge_label="WEB-1"
web2  ansible_host=192.168.56.22  server_badge_color="#b5651d"  server_badge_label="WEB-2"

# --- Pool 2 : serveurs Tomcat (application Java) ---
[app]
app1  ansible_host=192.168.56.31  server_badge_color="#6b46c1"  server_badge_label="APP-1"
app2  ansible_host=192.168.56.32  server_badge_color="#b83280"  server_badge_label="APP-2"

# --- Groupe parent : tout ce qui est DERRIÈRE le load balancer ---
[backends:children]
web
app

# --- Groupe parent : toutes les machines du lab ---
[lab:children]
lb
backends

# --- Variables appliquées à toutes les machines du lab ---
[lab:vars]
ansible_user=ansible
ansible_python_interpreter=/usr/bin/python3
