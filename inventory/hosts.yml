---
# ==========================================================
# inventory/hosts.yml — même inventaire au format YAML
# Pour l'utiliser : inventory = inventory/hosts.yml dans ansible.cfg
# ==========================================================
all:
  vars:
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3
  children:

    lb:
      hosts:
        lb1:
          ansible_host: 192.168.56.11

    web:
      hosts:
        web1:
          ansible_host: 192.168.56.21
          server_badge_color: "#1d7a46"
          server_badge_label: "WEB-1"
        web2:
          ansible_host: 192.168.56.22
          server_badge_color: "#b5651d"
          server_badge_label: "WEB-2"

    app:
      hosts:
        app1:
          ansible_host: 192.168.56.31
          server_badge_color: "#6b46c1"
          server_badge_label: "APP-1"
        app2:
          ansible_host: 192.168.56.32
          server_badge_color: "#b83280"
          server_badge_label: "APP-2"

    backends:
      children:
        web: {}
        app: {}

    lab:
      children:
        lb: {}
        backends: {}
