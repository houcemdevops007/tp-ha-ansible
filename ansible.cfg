# ==========================================================
# ansible.cfg — configuration locale du projet
# Lu automatiquement quand on lance ansible depuis ce dossier
# ==========================================================

[defaults]
# Inventaire par défaut : plus besoin de -i sur la ligne de commande
inventory            = inventory/hosts.ini

# Où chercher les rôles
roles_path           = roles

# Utilisateur SSH par défaut (surchargeable dans l'inventaire)
remote_user          = ansible

# Lab : on n'accepte pas manuellement les empreintes SSH des 5 VM
host_key_checking    = False

# Sortie lisible : affichage YAML + durée de chaque tâche
stdout_callback      = yaml
callbacks_enabled    = profile_tasks, timer

# Évite le warning « Python interpreter discovery »
interpreter_python   = auto_silent

# Nombre de machines traitées en parallèle
forks                = 10

# Pas de fichiers .retry qui polluent le dépôt
retry_files_enabled  = False
deprecation_warnings = False

# Décommentez à la section « ansible-vault » (partie 5)
# vault_password_file = .vault_pass

[privilege_escalation]
become               = True
become_method        = sudo
become_user          = root
become_ask_pass      = False

[ssh_connection]
# Accélère nettement l'exécution : une seule connexion SSH réutilisée
pipelining           = True
ssh_args             = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
